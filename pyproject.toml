[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ndfem"
version = "1.0.0"
description = "N-dimensional FEM for NumPy / PyTorch / JAX"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "rich>=10",
  "typer>=0.15,<1",
]
urls."Bug Tracker" = "https://github.com/34j/ndfem/issues"
urls.Changelog = "https://github.com/34j/ndfem/blob/main/CHANGELOG.md"
urls.documentation = "https://ndfem.readthedocs.io"
urls.repository = "https://github.com/34j/ndfem"
scripts.ndfem = "ndfem.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.extend-per-file-ignores."docs/conf.py" = [ "A001", "D401" ]
lint.extend-per-file-ignores."tests/**/*" = [ "S404", "S603" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
ini_options.addopts = """\
    -v
    -Wdefault
    --cov=ndfem
    --cov-report=term
    --cov-report=xml
    """
ini_options.pythonpath = [ "src" ]

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]
